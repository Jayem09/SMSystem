name: "Publish Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            arch: "aarch64-apple-darwin"
          - platform: "macos-latest"
            arch: "x86_64-apple-darwin"
          - platform: "windows-latest"
            arch: ""

    runs-on: ${{ matrix.platform }}
    env:
      VITE_API_BASE_URL: "http://168.144.46.137:8080"
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./frontend/src-tauri/target/release/build/
            ./frontend/src-tauri/target/release/deps/
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: cd frontend && npm ci

      - name: create production env file
        run: echo "VITE_API_BASE_URL=http://168.144.46.137:8080" > frontend/.env.production

      - name: build tauri app (macOS aarch64)
        if: matrix.arch == 'aarch64-apple-darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        run: |
          cd frontend
          npx tauri build --target aarch64-apple-darwin

      - name: build tauri app (macOS x86_64)
        if: matrix.arch == 'x86_64-apple-darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        run: |
          cd frontend
          npx tauri build --target x86_64-apple-darwin

      - name: build tauri app (Windows)
        if: matrix.arch == ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        run: |
          cd frontend
          npx tauri build

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SMSytem ${{ github.ref_name }}"
          body: |
            Automated release

            **macOS Users**: If you see 'SMSytem is damaged and can't be opened':
            1. Right-click the app → Click 'Open' (only needed first time)
               OR
            2. Run in terminal: sudo xattr -rd com.apple.quarantine /Applications/SMSytem.app

            This happens because the app isn't signed with an Apple Developer certificate (costs $99/year). The app is safe to use.
          draft: false
          prerelease: false
          files: |
            ./frontend/src-tauri/target/**/release/bundle/dmg/*.dmg
            ./frontend/src-tauri/target/**/release/bundle/nsis/*.exe
            ./frontend/src-tauri/target/**/release/bundle/app/*.tar.gz
            ./frontend/src-tauri/target/**/release/bundle/app/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
